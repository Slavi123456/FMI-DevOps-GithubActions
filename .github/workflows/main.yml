name: Main workflow
on: push
env:
  github_username: slavi123456      # ${{ github.actor }} #typically set like this, but docker/oci have restriction on uppercase
  github_password: ${{ secrets.GITHUB_TOKEN }}  # Must be made available to the workflow
  GIT_COMMIT: ${{ github.SHA }}
jobs:
  Build:
    runs-on: ubuntu-latest
    container: gradle:6-jdk11
    steps:
      - name: Clone down repository
        uses: actions/checkout@v7      
      - name: Build application
        run: ci/build-app.sh
      - name: Test
        run: ci/unit-test-app.sh
      - name: Upload repo
        uses: actions/upload-artifact@v7
        with:  
          name: code
          path: . 
          include-hidden-files: true
  Docker-image:
    runs-on: ubuntu-latest
    needs: [Build]
    permissions: 
      packages: write
    steps:
      - name: Download the code
        uses: actions/download-artifact@v8
        with:
            name: code
            path: .
# with actions but in the Container Registy
      - name: Login to Github Container registry
        uses: docker/login-action@v4
        with: 
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push 
        uses: docker/build-push-action@v7
        with:
          context: app
          push: true
          tags: |
            ghcr.io/${{ env.github_username }}/micronaut-app:1.0-${{ env.GIT_COMMIT }}
            ghcr.io/${{ env.github_username }}/micronaut-app:latest          
      - name: Run snyk
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ghcr.io/${{ env.github_username }}/micronaut-app:1.0-${{ github.sha }}
    
  # Component-test:
