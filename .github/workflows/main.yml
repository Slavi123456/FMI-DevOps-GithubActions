  #   container: gradle:6-jdk11
  #   steps:
  #     - name: Download code
  #       uses: actions/download-artifact@v8
  #       with: 
  #         name: code
  #         path: .
  #     - name: Run Linting
  #       uses: super-linter/super-linter@v9
  #       env: 
  #         #To report Github Actions status checks
  #         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  #         # USE_FIND_ALG means to scan the codebase instead of using git
  #         # DEFAULT_BRANCH: main   
  #         VALIDATE_ALL_CODEBASE: true
  #         USE_FIND_ALGORITHM: true      
  #         DISABLE_ERRORS: true
  #         SAVE_SUPER_LINTER_SUMMARY: true
  Docker-image:
    runs-on: ubuntu-latest
    needs: [Build]
    permissions: 
      packages: write
    steps:
      - name: Download the code
        uses: actions/download-artifact@v8
        with:
            name: code
            path: .
# With bash
      # - name: build docker
      #   run: bash ci/build-docker.sh
      # - name: push docker
      #   run: bash ci/push-docker.sh 
# with actions but in the Container Registy
      - name: Login to Github Container registry
        uses: docker/login-action@v4
        with: 
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push 
        uses: docker/build-push-action@v7
        with:
          context: app
          push: true
          tags: |
            ghcr.io/${{ env.github_username }}/micronaut-app:1.0-${{ env.GIT_COMMIT }}
            ghcr.io/${{ env.github_username }}/micronaut-app:latest          
        

